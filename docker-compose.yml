services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hameed
      POSTGRES_PASSWORD: Asmath@2001
      POSTGRES_DB: perp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
